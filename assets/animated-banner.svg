<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 275" width="1200" height="275" role="img" aria-labelledby="title desc">
  <title id="title">Software Engineering, AI and Automation — animated banner</title>
  <desc id="desc">Dark gradient technology banner with gentle animated lines and glowing nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1225"/>
      <stop offset="50%" stop-color="#111e38"/>
      <stop offset="100%" stop-color="#20204b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="48%" stop-color="#22d3ee" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="headline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5f6ff"/>
      <stop offset="100%" stop-color="#d5c6ff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b4c5ef" opacity=".13"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="rounded"><rect x="1.5" y="1.5" width="1197" height="272" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="275" fill="url(#background)"/>
    <rect width="1200" height="275" fill="url(#dots)"/>
    <path d="M-30 247C210 112 323 303 564 171S925 95 1235 17" fill="none" stroke="url(#trail)" stroke-width="2" opacity=".44"/>
    <path d="M-25 272C240 130 369 323 611 195S945 122 1235 44" fill="none" stroke="#b692ff" stroke-width="1" opacity=".23"/>
    <path d="M585 10C710 106 855-7 997 95s171 51 228 30" fill="none" stroke="#67e8f9" stroke-width="1" opacity=".19"/>
    <g opacity=".18" fill="none" stroke="#a5b4fc">
      <circle cx="989" cy="135" r="91"/>
      <circle cx="989" cy="135" r="119"/>
      <circle cx="989" cy="135" r="147"/>
      <path d="M842 135h295M989-12v295"/>
    </g>
    <g>
      <circle cx="989" cy="135" r="40" fill="#38bdf8" opacity=".11" filter="url(#glow)">
        <animate attributeName="opacity" values=".07;.19;.07" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="989" cy="135" r="30" fill="none" stroke="#38bdf8" stroke-width="1.7" opacity=".72"/>
      <circle cx="989" cy="135" r="12" fill="#67e8f9" opacity=".83">
        <animate attributeName="opacity" values=".83;.42;.83" dur="4s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity=".88">
        <path d="m923 136-14-13 14-13"/>
        <path d="m1054 110 14 13-14 13"/>
      </g>
      <g>
        <circle cx="989" cy="44" r="5" fill="#a78bfa">
          <animate attributeName="opacity" values=".35;1;.35" dur="3.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1108" cy="135" r="4" fill="#67e8f9">
          <animate attributeName="opacity" values="1;.3;1" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="906" cy="218" r="4.5" fill="#c084fc">
          <animate attributeName="opacity" values=".25;1;.25" dur="4.2s" repeatCount="indefinite"/>
        </circle>
      </g>
