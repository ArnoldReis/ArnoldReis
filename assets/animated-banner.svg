    <text x="73" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#b8c9e9">Backend  ·  AI agents  ·  Software architecture</text>
    <path d="M72 209h424" stroke="#a5b4fc" opacity=".25"/>
    <text x="73" y="236" font-family="Consolas, Menlo, monospace" font-size="14" fill="#67e8f9" opacity=".9">&gt; thoughtful systems, practical impact_</text>
    <rect x="1.5" y="1.5" width="1197" height="272" rx="18" fill="none" stroke="#8b9cc4" stroke-opacity=".27" stroke-width="3"/>
  </g>
</svg>